spring:
  application:
    name: memorip

  # Database
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/memorip?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Jackson (JSON null 필드 제외)
  jackson:
    default-property-inclusion: non_null
